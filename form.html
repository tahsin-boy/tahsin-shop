<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Galada&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <title>toko lumo BD - Online Shop</title>
  
  <style>
    :root {
        --back-color: rgb(9, 40, 9);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        width: 100%;
        background-color: #f9f9f9;
    }

    /* হেডার ডিজাইন */
    header {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background-color: var(--back-color);
        width: 100%;
        height: 90px;
        z-index: 1000;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    header .logo img {
        width: 140px;
        margin-top: -10px;
    }

    header .link {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    header .link h3 {
        display: none;
        color: #ffffff;
        cursor: pointer;
        font-size: 24px;
    }

    header ul {
        display: flex;
        gap: 15px;
        list-style: none;
        align-items: center;
    }

    header ul li {
        position: relative;
        padding: 5px;
    }

    header ul li a {
        text-decoration: none;
        color: #ffffff;
        text-transform: capitalize;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    header ul li a i {
        font-size: 12px;
        transition: transform 0.25s ease;
    }

    header ul li:hover > a i {
        transform: rotate(90deg);
    }

    /* ড্রপডাউন মেনু */
    header ul li > ul {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background-color: var(--back-color);
        border: 1px solid #d5e7ef;
        border-radius: 8px;
        flex-direction: column;
        min-width: 150px;
        padding: 10px;
    }

    header ul li:hover > ul {
        display: flex;
    }

    header ul li > ul li {
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding: 8px;
    }

    header ul li > ul li:last-child {
        border-bottom: none;
    }

    header ul li > ul li a {
        font-size: 14px;
        color: #fff;
    }

    /* কার্ট আইকন ও কাউন্টার */
    .cart-icon {
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        position: relative;
    }

    #cart-count {
        position: absolute;
        top: -8px;
        right: -10px;
        background-color: red;
        color: white;
        font-size: 12px;
        padding: 2px 6px;
        border-radius: 50%;
    }

    /* মেইন সেকশন বা প্রোডাক্ট ক্যাটালগ */
    .main-container {
        max-width: 1200px;
        margin: 120px auto 40px auto;
        padding: 20px;
    }

    .section-title {
        font-size: 24px;
        color: var(--back-color);
        margin-bottom: 20px;
        border-bottom: 2px solid var(--back-color);
        padding-bottom: 5px;
    }

    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }

    .product-card {
        background: #ffffff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        transition: transform 0.3s;
    }

    .product-card:hover {
        transform: translateY(-5px);
    }

    .product-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 6px;
        background-color: #eee;
    }

    .product-card h4 {
        margin: 15px 0 10px 0;
        color: #333;
        font-size: 18px;
    }

    .product-card p {
        color: #27ae60;
        font-size: 18px;
        margin-bottom: 15px;
        font-weight: bold;
    }

    .product-card button {
        background-color: #25d366; /* WhatsApp Green */
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
    }

    .product-card button:hover {
        background-color: #1ebe57;
    }

    /* মিডিয়া কোয়েরি (মোবাইল ভিউ) */
    @media all and (max-width: 768px) {
        header .link h3 {
            display: block;
        }

        header .link ul.nav-links {
            display: none;
            flex-direction: column;
            position: absolute;
            top: 90px;
            left: 0;
            width: 100%;
            background-color: var(--back-color);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header .link ul.nav-links.show-menu {
            display: flex;
        }

        header ul li > ul {
            position: relative;
            background-color: transparent;
            border: none;
            padding-left: 15px;
            display: none;
        }

        header ul li:hover > ul {
            display: block;
        }

        header ul li > ul li {
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 8px 0;
        }
    }
  </style>
</head>

<body>

  <!-- হেডার অংশ -->
  <header>
    <div class="logo">
      <img src="toko.png" alt="Toko Lumo BD">
    </div>
    <div class="link">
      <div class="cart-icon">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span>
      </div>
      <h3 id="menu-toggle"><i class="fa-solid fa-bars"></i></h3>
      
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Perfume <i class="fa-solid fa-chevron-right"></i></a>
          <ul>
            <li><a href="#">Perfume Oil</a></li>
            <li><a href="#">Perfume</a></li>
            <li><a href="#">Body Spray</a></li>
          </ul>
        </li>
        <li><a href="#">Clothing <i class="fa-solid fa-chevron-right"></i></a>
          <ul>
            <li><a href="#">Men's Clothing</a></li>
            <li><a href="#">Women's Clothing</a></li>
          </ul>
        </li>
        <li><a href="#">Contact Me</a></li>
      </ul>
    </div>
  </header>

  <!-- প্রোডাক্ট সেকশন -->
  <div class="main-container">
    <h2 class="section-title">Featured Collection</h2>
    <div class="product-grid">
      
      <!-- প্রোডাক্ট ১ -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500&auto=format&fit=crop&q=60" alt="Luxury Perfume">
        <h4>Luxury Oud Perfume</h4>
        <p>৳ ১২০০</p>
        <button onclick="orderOnWhatsApp('Luxury Oud Perfume', '১২০০')">
          <i class="fa-brands fa-whatsapp"></i> Order on WhatsApp
        </button>
      </div>

      <!-- প্রোডাক্ট ২ -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=500&auto=format&fit=crop&q=60" alt="Perfume Oil">
        <h4>Royal Musk Perfume Oil</h4>
        <p>৳ ৮৫০</p>
        <button onclick="orderOnWhatsApp('Royal Musk Perfume Oil', '৮৫০')">
          <i class="fa-brands fa-whatsapp"></i> Order on WhatsApp
        </button>
      </div>

      <!-- প্রোডাক্ট ৩ -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?w=500&auto=format&fit=crop&q=60" alt="Body Spray">
        <h4>Fresh Body Spray</h4>
        <p>৳ ৬৫০</p>
        <button onclick="orderOnWhatsApp('Fresh Body Spray', '৬৫০')">
          <i class="fa-brands fa-whatsapp"></i> Order on WhatsApp
        </button>
      </div>

      <!-- প্রোডাক্ট ৪ -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1615397349754-cfa2066a298e?w=500&auto=format&fit=crop&q=60" alt="Men's Clothing">
        <h4>Men's Premium Shirt</h4>
        <p>৳ ১৫০০</p>
        <button onclick="orderOnWhatsApp(\"Men's Premium Shirt\", '১৫০০')">
          <i class="fa-brands fa-whatsapp"></i> Order on WhatsApp
        </button>
      </div>

    </div>
  </div>

  <!-- জাভাস্ক্রিপ্ট -->
  <script>
    // মোবাইল মেনু টগল
    const menuToggle = document.getElementById('menu-toggle');
    const navLinks = document.querySelector('.nav-links');

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show-menu');
    });

    // WhatsApp অর্ডার ফাংশন
    let cartCount = 0;
    function orderOnWhatsApp(productName, price) {
      cartCount++;
      document.getElementById('cart-count').innerText = cartCount;

      // আপনার দেওয়া WhatsApp নম্বর
      let phoneNumber = "8801617174700";
      let message = `Hello, I want to buy this product:\n*Product:* ${productName}\n*Price:* ৳ ${price}`;
      
      let whatsappURL = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
      
      // নতুন ট্যাবে WhatsApp ওপেন হবে
      window.open(whatsappURL, '_blank');
    }
  </script>

</body>

</html>
